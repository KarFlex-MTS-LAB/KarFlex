name: Android Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platform-tools" "platforms;android-37"

      - name: Grant Gradle execute permission
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Name APK
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            apk_name="KarFlex-${GITHUB_REF_NAME}.apk"
          else
            apk_name="KarFlex-debug-${GITHUB_SHA}.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${apk_name}"
          echo "APK_PATH=app/build/outputs/apk/debug/${apk_name}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KarFlex-${{ github.ref_name }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release and attach APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "${APK_PATH}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "KarFlex ${GITHUB_REF_NAME}" \
            --generate-notes
